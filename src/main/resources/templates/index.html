<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Blog Home</title>
    <link rel="stylesheet" href="../static/css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- For Bootstrap WebJar -->
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <!-- For jQuery WebJar -->
    <script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="container">
    <header class="header">
        <h1 class="logo">Blog<span class="accent">Site</span></h1>
        <a class="btn-primary" th:href="@{/blog/posts/new}">Create New Post</a>
    </header>
    <main>
        <ul class="post-list">
            <li class="post-card" th:each="post : ${posts}">
                <div class="post-content">
                    <a class="post-title" th:href="@{'/blog/posts/' + ${post.id}}" th:text="${post.title}"></a>
                    <div class="post-actions">
                        <a class="btn-link" th:href="@{'/blog/posts/edit/' + ${post.id}}">Edit</a>
                        <form th:action="@{'/blog/posts/delete/' + ${post.id}}" method="post" style="display:inline;">
                            <button class="btn-link danger" type="submit">Delete</button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </main>
</body>
</html>
